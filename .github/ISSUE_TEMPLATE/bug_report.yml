name: Bug report
description: Report a defect in a CicadaRelay repository
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give exact steps, commands, or inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, repo, branch, deployment context, and any relevant versions.
  - type: textarea
    id: risk
    attributes:
      label: Operational impact
      description: Explain whether this affects routing, exposure, deployment, data integrity, or production behavior.
