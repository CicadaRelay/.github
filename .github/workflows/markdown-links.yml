name: Markdown Hygiene

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify markdown files exist
        run: |
          find . -type f \( -name "*.md" -o -name "*.markdown" \) | sort
